<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CASIO</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CASIO">
<meta name="format-detection" content="telephone=no">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);
-webkit-font-smoothing:antialiased;}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#e6e6e6;}
#wrap{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-box;display:-webkit-flex;display:flex;
-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;
-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
-webkit-box-align:center;-webkit-align-items:center;align-items:center;text-align:center;}
#logo{color:#1b4fc4;font-weight:bold;font-size:14vmin;letter-spacing:1vmin;margin-bottom:1.5vmin;}
#rec{font-size:2.6vmin;letter-spacing:.6vmin;color:#bdbdbd;margin-bottom:16vmin;}
.t{font-size:4vmin;letter-spacing:.6vmin;margin:1.4vmin 0;font-weight:normal;}
#main{width:100%;text-align:center;}
#bar{width:60%;height:1.2vmin;background:#2a2a2a;margin:3vmin auto 0 auto;}
#fill{height:100%;width:10%;background:#e6e6e6;}
#pct{width:100%;text-align:center;font-size:3.4vmin;margin-top:2.5vmin;color:#bdbdbd;letter-spacing:.4vmin;}
#dim{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);
opacity:0;visibility:hidden;-webkit-transition:opacity .4s ease,visibility 0s linear .4s;transition:opacity .4s ease,visibility 0s linear .4s;}
#dim.show{opacity:1;visibility:visible;-webkit-transition:opacity .4s ease;transition:opacity .4s ease;}
#dlg{position:absolute;top:50%;left:50%;width:440px;height:200px;margin:-100px 0 0 -220px;
box-sizing:border-box;-webkit-box-sizing:border-box;background:#cdcdcd;border:1px solid #5a5a5a;
-webkit-box-shadow:inset 1px 1px 0 #f4f4f4,inset -1px -1px 0 #8e8e8e,6px 6px 0 rgba(0,0,0,.55);
box-shadow:inset 1px 1px 0 #f4f4f4,inset -1px -1px 0 #8e8e8e,6px 6px 0 rgba(0,0,0,.55);}
#tb{height:28px;line-height:28px;padding:0 12px;background:#4a4a4a;color:#f0f0f0;font-size:13px;font-weight:bold;letter-spacing:.5px;text-align:left;}
#ico{position:absolute;left:28px;top:56px;width:40px;height:40px;box-sizing:border-box;-webkit-box-sizing:border-box;
border:2px solid #4a4a4a;background:#e4e4e4;color:#333;font-size:24px;font-weight:bold;line-height:36px;text-align:center;}
#tx{position:absolute;left:88px;right:28px;top:52px;text-align:left;}
#ttl{font-size:17px;font-weight:bold;color:#111;margin-bottom:10px;}
#msg{font-size:15px;line-height:22px;color:#222;}
</style>
</head>
<body>
<div id="wrap">
  <div id="logo">CASIO</div>
  <div id="rec">RECOVERY MODE</div>
  <div id="main">
    <div class="t">FIRMWARE UPDATE - VER. 1.5d</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">10%</div>
  </div>
</div>
<div id="dim"><div id="dlg">
  <div id="tb">Firmware Update</div>
  <div id="ico">i</div>
  <div id="tx">
    <div id="ttl">Firmware update completed</div>
    <div id="msg">Please turn Projector off, wait 1 Minute, then turn back on</div>
  </div>
</div></div>
<script>
(function(){
  var TOTAL = 80 * 60 * 1000;       // gesamt 1 Std 20 Min
  var PHASE1 = 3 * 60 * 1000;       // 10% -> 45% in 3 Minuten
  
  // var TOTAL = 20 * 1000;            // TEST
  // var PHASE1 = 10 * 1000;           // TEST
  
  var start = new Date().getTime();
  var fill = document.getElementById('fill');
  var pct = document.getElementById('pct');
  var dim = document.getElementById('dim');

  function calc(t){
    if (t < 0) t = 0;
    if (t < PHASE1) return 10 + 35 * (t / PHASE1);
    if (t >= TOTAL) return 100;
    return 45 + 55 * ((t - PHASE1) / (TOTAL - PHASE1));
  }
  function tick(){
    var p = calc(new Date().getTime() - start);
    if (p >= 100) {
      fill.style.width = '100%';
      pct.innerHTML = '100%';
      dim.className = 'show';
      return;
    }
    fill.style.width = Math.floor(p) + '%';
    pct.innerHTML = Math.floor(p) + '%';
  }
  tick();
  setInterval(tick, 1000);

  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, false);
})();
</script>
</body>
</html>
